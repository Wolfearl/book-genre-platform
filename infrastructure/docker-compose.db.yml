services:
  postgres:
    image: postgres:16
    container_name: book_platform_postgres
    environment:
      POSTGRES_DB: book_platform
      POSTGRES_USER: book_user
      POSTGRES_PASSWORD: book_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - book_network

volumes:
  postgres_data:

networks:
  book_network:
    driver: bridge