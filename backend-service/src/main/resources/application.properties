spring.application.name=bookapi

# Datasource configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/java_books
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=book_user
spring.datasource.password=book_password

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Show SQL in logs (disable in production)
spring.jpa.show-sql=true

# Disable H2 console (we're using PostgreSQL now)
spring.h2.console.enabled=false

# logging.level.org.springframework=DEBUG
# logging.level.org.hibernate=DEBUG